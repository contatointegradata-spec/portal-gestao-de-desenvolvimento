# =====================================================
# GESTAO DE DESENVOLVIMENTO - INTEGRADATA
# =====================================================
# Bloco para colar dentro de "http { ... }" no nginx.conf do Clinic Pro (o nginx que
# ja ocupa as portas 80/443 da VPS). Ele alcanca o container pela rede compartilhada
# "integradata_proxy" (ver deploy/docker-compose.vps.yml). Troque o server_name pelo
# dominio/subdominio apontado para a VPS.
server {
    listen 80;
    server_name gestaodev.integradata.app.br;

    # Arquivos de entrada dos RPAs (RPA_MAX_FILE_MB=25) + importacao de colecoes.
    client_max_body_size 30M;

    # Transmissao ao vivo do navegador do robo (noVNC). No .env da aplicacao:
    #   RPA_LIVE_VIEW_URL=http://gestaodev.integradata.app.br/live-view
    location /live-view/ {
        set $gestao_live http://gestao-dev-integradata:6080;
        rewrite ^/live-view/(.*)$ /$1 break;
        proxy_pass $gestao_live;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_buffering off;
    }

    location / {
        set $gestao_app http://gestao-dev-integradata:5174;
        proxy_pass $gestao_app;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Logs das execucoes chegam em tempo real (streaming): sem buffer e sem corte.
        proxy_buffering off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
