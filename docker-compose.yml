services:
  gestao-dev:
    # Em producao (VPS) a imagem ja vem pronta do ghcr.io, publicada pelo GitHub Actions
    # (.github/workflows/deploy.yml). O "build" continua valendo para rodar localmente:
    #   docker compose up -d --build
    image: ghcr.io/contatointegradata-spec/portal-gestao-de-desenvolvimento:${RELEASE_SHA:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RELEASE_SHA: ${RELEASE_SHA:-development}
    container_name: gestao-dev-integradata
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=5174
      - DISPLAY=:99
    ports:
      # Padrao: so a propria maquina acessa (na VPS o nginx faz o proxy com HTTPS).
      # Para expor direto na rede, defina APP_BIND=0.0.0.0 no .env.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-5174}:5174"
      # Transmissao ao vivo do navegador do RPA (noVNC, somente visualizacao)
      - "${APP_BIND:-127.0.0.1}:${LIVE_VIEW_PORT:-6080}:6080"
    volumes:
      # Banco SQLite + chave de criptografia (.gestao-secret.key) persistem fora do container.
      - ./data:/app/data
    shm_size: "2gb"
